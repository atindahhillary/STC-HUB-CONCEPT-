        - paragraph [ref=e1226]: Concept review
        - heading "Six expert lenses, applied before any money moves." [level=2] [ref=e1227]
        - paragraph [ref=e1228]: The concept note was stress-tested across six disciplines, using desk research on Kenyan prices, policy and outcome evidence. Each lens gives a verdict and the conditions it attaches. Those conditions are built into Phase 1.
      - generic [ref=e1229]:
        - article [ref=e1230]:
          - generic [ref=e1231]:
            - generic [ref=e1232]: 
            - heading "Architecture and structures" [level=4] [ref=e1233]
          - generic [ref=e1234]: Go, with conditions
          - paragraph [ref=e1235]: A stacked L is buildable if every opening gets a welded steel frame, containers stack corner-on-corner and the cantilever is engineered and peer-reviewed.
          - paragraph [ref=e1236]: "Condition: a 2.35 m wide container fits one row of desks. Test a double-width Digital Lab or a shaded veranda extension before the design is frozen."
        - article [ref=e1237]:
          - generic [ref=e1238]:
            - generic [ref=e1239]: 
            - heading "Climate and building physics" [level=4] [ref=e1240]
          - generic [ref=e1241]: Go, with conditions
          - paragraph [ref=e1242]: Mombasa averages 27.9°C and peaks at 33.1°C in February, and salt air corrodes weathering steel. Unshaded steel boxes would be unusable.
          - paragraph [ref=e1243]: "Condition: a ventilated fly roof over all five containers, ISO 12944 C4/C5 coatings, piers 450 to 600 mm high and cross-ventilation to the monsoon winds."
        - article [ref=e1244]:
          - generic [ref=e1245]:
            - generic [ref=e1246]: 
            - heading "Circular economy and policy" [level=4] [ref=e1247]
          - generic [ref=e1248]: Strong go
          - paragraph [ref=e1249]: The county names the gap Waste Bridge fills, and the 2024 EPR rules create producers who must pay for verified data. Raw plastic sells for only KES 10 to 27 a kilo.
          - paragraph [ref=e1250]: "Condition: earn from services, data and products, not commodity margins. Sign pilot MoUs with a producer responsibility organisation and the county."
        - article [ref=e1251]:
          - generic [ref=e1252]:
            - generic [ref=e1253]: 
            - heading "Education and enterprise" [level=4] [ref=e1254]
          - generic [ref=e1255]: Go
          - paragraph [ref=e1256]: CBE creates structural demand for practical STEM, and global meta-analyses show project-based learning lifts achievement (d = 0.71). The evidence for makerspaces in Africa is thin, which makes the Hub's own measured results valuable.
          - paragraph [ref=e1257]: "Condition: run schools as lab-as-a-service, select incubatees from the Hub's own pipeline and publish 180-day outcomes with response rates."
        - article [ref=e1258]:
          - generic [ref=e1259]:
            - generic [ref=e1260]: 
            - heading "Impact finance" [level=4] [ref=e1261]
          - generic [ref=e1262]: Go, with conditions
          - paragraph [ref=e1263]: "Covering 26% of costs from earned revenue in Year 1 and 58% by Year 3 beats most African hubs. That depends on B2B lines: schools, corporate training, production and consultancy."
          - paragraph [ref=e1264]: "Condition: get quotes from two or three Mombasa fabricators, secure a registered lease of 10+ years and sell container partnerships before opening."
        - article [ref=e1265]:
          - generic [ref=e1266]:
            - generic [ref=e1267]: 
            - heading "Safeguarding and compliance" [level=4] [ref=e1268]
          - generic [ref=e1269]: Go, with conditions
          - paragraph [ref=e1270]: Children, adults, machines and waste pickers' data share one site. That is manageable with the right controls, and investors will check it.
          - paragraph [ref=e1271]: "Condition: register with the Data Protection Commissioner, run a DPIA for Waste Bridge, require DCI clearance for all staff, provide PWD Act 2025 access and file one NEMA EIA covering the Eco-Print Lab."
