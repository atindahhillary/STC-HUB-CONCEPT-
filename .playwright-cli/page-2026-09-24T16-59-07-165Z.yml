        - heading "Waste Bridge makes the loop physical." [level=2] [ref=e647]
        - paragraph [ref=e648]: Mombasa's own development plan says its digital waste-collection platform "could not be implemented due to lack of technical personnel in ICT". Waste Bridge is built for exactly that gap, and the Hub trains the people to run it.
        - paragraph [ref=e649]: Since November 2024, every producer and importer in Kenya must prove what happens to its packaging, reporting collected and recycled volumes to NEMA and to counties each year. Most of Mombasa's plastic is recovered by informal collectors who produce no data. Waste Bridge is designed to log, verify and connect that supply to buyers, and the Eco-Print Lab turns part of it into products and income.
